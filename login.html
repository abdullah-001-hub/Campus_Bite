
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus-Bite | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #fff8f0, #ffd9b5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            max-width: 420px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 25px #00000020;
        }

        .brand {
            color: #e85d04;
            font-weight: bold;
        }

        .form-control {
            padding: 11px;
        }

        .login-btn {
            background: #e85d04;
            color: white;
            padding: 11px;
            border: none;
        }

        .login-btn:hover {
            background: #c94f00;
            color: white;
        }

        a {
            color: #e85d04;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container py-4">
    <div class="card login-card mx-auto p-4">

        <h2 class="brand text-center">Campus-Bite</h2>
        <p class="text-center text-muted mb-4">Student Login</p>

        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
                <div class="alert alert-info">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label class="form-label">Email Address</label>
            <input type="email" name="email"
                   class="form-control mb-3"
                   placeholder="Enter your email" required>

            <label class="form-label">Password</label>
            <div class="input-group mb-3">
                <input type="password" name="password"
                       id="password" class="form-control"
                       placeholder="Enter password" required>

                <button type="button"
                        class="btn btn-outline-secondary"
                        id="showBtn"
                        onclick="showPassword()">
                    Show
                </button>
            </div>

            <button type="submit" class="btn login-btn w-100">
                Login
            </button>

        </form>

        <p class="text-center mt-3 mb-0">
            New student?
            <a href="/register">Register here</a>
        </p>

    </div>
</div>

<script>
    function showPassword() {
        let password = document.getElementById("password");
        let button = document.getElementById("showBtn");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
        } else {
            password.type = "password";
            button.textContent = "Show";
        }
    }
</script>

</body>
</html>
